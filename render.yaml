# Render yayın tarifi: Render bu dosyayı okuyup uygulamayı kendisi kurar.
services:
  - type: web
    name: mamaaura
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mamaaura-veri
      mountPath: /var/data
      sizeGB: 1
